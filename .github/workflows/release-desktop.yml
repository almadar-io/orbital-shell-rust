name: Release orb-desktop

# A v* tag also publishes the desktop program built from this repo's renderers:
# @almadar/orb-desktop (+ one platform package per OS/arch). orb installs it by
# default; it runs the window, Layer 2 coverage and screenshots.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: almadar-io/orbital-core/.github/workflows/program-release.yml@main
    with:
      name: orb-desktop
      kind: desktop
      cargo-args: --features desktop --bin orb-desktop
      linux-libc: gnu
    secrets: inherit
