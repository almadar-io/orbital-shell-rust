[package]
name = "orbital-shell-rust"
version = "18.0.1"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/almadar-io/orbital-shell-rust"
description = "Rust shell for the Orbital compiler"

[dependencies]
orbital-core = { git = "https://github.com/almadar-io/orbital-core", branch = "main", features = ["native-transport"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quote = "1.0"
proc-macro2 = "1.0"
# The native program host (`host`).
anyhow = "1.0"
parking_lot = "0.12"
tracing = "0.1"
tokio = { version = "1.0", default-features = false, features = ["sync"] }

# The desktop program (`orb-desktop`): this shell's renderers as a GUI host.
orbital-client-dioxus = { path = "renderers/dioxus", features = ["native"], optional = true }
orbital-client-tui = { path = "renderers/tui", optional = true }

[features]
desktop = ["dep:orbital-client-dioxus", "dep:orbital-client-tui", "orbital-core/client-http"]

[[bin]]
name = "orb-desktop"
path = "src/bin/orb-desktop.rs"
required-features = ["desktop"]

[dev-dependencies]
pretty_assertions = "1.4"
syn = { version = "2", features = ["full"] }
