[package]
name = "orbital-shell-rust"
version = "18.0.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/almadar-io/orbital-shell-rust"
description = "Rust shell for the Orbital compiler"

[dependencies]
orbital-core = { git = "https://github.com/almadar-io/orbital-core", branch = "main" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
syn = { version = "2", features = ["full"] }
