[package]
name = "{{APP_NAME}}"
version = "0.1.0"
edition = "2021"

# The runtime crates are consumed by relative path, so a generated app must be
# emitted INSIDE the orbital-rust workspace (two levels under the repo root).
# Portable builds (git/published-version deps) are deferred — see RS-2 in
# docs/Almadar_Compiler_Gaps.md.
[dependencies]
orbital-core = { path = "../../crates/orbital-core", features = ["client-http"] }
orbital-server = { path = "../../crates/orbital-server" }
orbital-client-dioxus = { path = "../../crates/orbital-shell-rust/renderers/dioxus", features = ["native"] }
orbital-client-tui = { path = "../../crates/orbital-shell-rust/renderers/tui" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"

[[bin]]
name = "terminal"
path = "src/bin/terminal.rs"

[[bin]]
name = "game"
path = "src/bin/game.rs"

# Keep the generated project independent of any parent workspace.
[workspace]

# The renderers name their public siblings by git; point them at the same
# checkout this app builds against, and carry the renderer's upstream patches.
[patch."https://github.com/almadar-io/orbital-core"]
orbital-core = { path = "../../crates/orbital-core" }
orbital-core-base = { path = "../../crates/orbital-core/crates/base" }
orbital-core-eval = { path = "../../crates/orbital-core/crates/eval" }
orbital-core-runtime = { path = "../../crates/orbital-core/crates/runtime" }

[patch."https://github.com/almadar-io/orbital-canvas"]
orbital-canvas = { path = "../../crates/orbital-canvas" }

[patch.crates-io]
dioxus-native = { path = "../../crates/orbital-shell-rust/renderers/dioxus/vendor/dioxus-native" }
blitz-dom = { path = "../../crates/orbital-shell-rust/renderers/dioxus/vendor/blitz-dom" }
